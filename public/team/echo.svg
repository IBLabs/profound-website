<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Echo, AI analyst agent">
  <defs>
    <radialGradient id="echo-bg" cx="32%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#3a1f08"/>
      <stop offset="55%" stop-color="#1a0d04"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </radialGradient>
    <linearGradient id="echo-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd9a8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#echo-bg)"/>

  <!-- pulse rings -->
  <g fill="none" stroke="#ff5a1a" stroke-width="1.5">
    <circle cx="200" cy="200" r="46" opacity="1"/>
    <circle cx="200" cy="200" r="86" opacity="0.7"/>
    <circle cx="200" cy="200" r="130" opacity="0.42"/>
    <circle cx="200" cy="200" r="180" opacity="0.2"/>
  </g>

  <!-- scanning beam wedge -->
  <path d="M 200 200 L 360 80 A 200 200 0 0 0 320 56 Z" fill="url(#echo-beam)" opacity="0.9"/>
  <line x1="200" y1="200" x2="360" y2="80" stroke="#ffd9a8" stroke-width="2.2" opacity="0.9" stroke-linecap="round"/>

  <!-- central node -->
  <circle cx="200" cy="200" r="18" fill="#e64500"/>
  <circle cx="200" cy="200" r="8" fill="#fff5e6"/>

  <!-- data points -->
  <g>
    <circle cx="305" cy="135" r="6" fill="#ffd9a8"/>
    <circle cx="305" cy="135" r="13" fill="none" stroke="#ffd9a8" stroke-width="1" opacity="0.55"/>
  </g>
  <circle cx="118" cy="108" r="5" fill="#ff5a1a"/>
  <circle cx="318" cy="298" r="4.5" fill="#ffb066" opacity="0.85"/>
  <circle cx="92" cy="290" r="4" fill="#ff5a1a" opacity="0.7"/>
  <circle cx="78" cy="186" r="3" fill="#ffb066" opacity="0.55"/>
  <circle cx="262" cy="332" r="3" fill="#ff5a1a" opacity="0.55"/>
  <circle cx="148" cy="62" r="2.5" fill="#ffd9a8" opacity="0.65"/>

  <!-- crosshair ticks -->
  <g stroke="#ff5a1a" stroke-width="1.2" opacity="0.45">
    <line x1="200" y1="14" x2="200" y2="28"/>
    <line x1="200" y1="372" x2="200" y2="386"/>
    <line x1="14" y1="200" x2="28" y2="200"/>
    <line x1="372" y1="200" x2="386" y2="200"/>
  </g>
</svg>
